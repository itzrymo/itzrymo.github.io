<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REDLINE | Tennessee</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at center, #2b0000 0%, #090909 45%, #000000 100%);

            color: white;
            overflow: hidden;
        }

        /* Background red glow */
        body::before {
            content: "";
            position: fixed;
            width: 600px;
            height: 600px;
            background: rgba(180, 0, 0, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 650px;
            text-align: center;
        }

        /* Main Box */
        .main-box {
            background: rgba(15, 15, 15, 0.95);
            border: 2px solid #b30000;
            border-radius: 18px;
            padding: 40px 30px;
            box-shadow:
                0 0 20px rgba(180, 0, 0, 0.4),
                0 0 60px rgba(180, 0, 0, 0.15);
        }

        /* Logo / Title */
        .logo {
            font-size: 55px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #ffffff;
            text-shadow:
                0 0 10px #ff0000,
                0 0 25px rgba(255, 0, 0, 0.6);
            margin-bottom: 5px;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            letter-spacing: 3px;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        /* Navigation Buttons */
        .tabs {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .tab {
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 60px;
            padding: 15px;

            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;

            background: #111;
            border: 1px solid #444;
            border-radius: 10px;

            transition: 0.25s ease;
        }

        .tab:hover {
            background: #b30000;
            border-color: #ff0000;
            transform: translateY(-3px);

            box-shadow:
                0 5px 20px rgba(255, 0, 0, 0.35);
        }

        /* Timer Section */
        .timer-box {
            margin-top: 28px;
            padding: 20px;

            background: linear-gradient(
                135deg,
                #160000,
                #090909
            );

            border: 1px solid #700000;
            border-radius: 12px;
        }

        .timer-title {
            font-size: 13px;
            color: #999;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        #countdown {
            font-size: 25px;
            font-weight: bold;
            color: #ff3333;
            letter-spacing: 2px;
        }

        .meet-date {
            margin-top: 8px;
            font-size: 13px;
            color: #777;
        }

        /* Footer */
        .footer {
            margin-top: 20px;
            color: #555;
            font-size: 12px;
        }

        /* Mobile */
        @media (max-width: 500px) {

            .main-box {
                padding: 30px 20px;
            }

            .logo {
                font-size: 40px;
                letter-spacing: 5px;
            }

            .tab {
                font-size: 15px;
            }

            #countdown {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="main-box">

            <div class="logo">
                REDLINE
            </div>

            <div class="subtitle">
                Tennessee Car & Bike Community
            </div>


            <!-- WEBSITE TABS -->
            <div class="tabs">

                <!-- TikTok -->
                <a
                    class="tab"
                    href="https://www.tiktok.com/"
                    target="_blank"
                >
                    🎵 TikTok Page
                </a>

                <!-- Merch -->
                <a
                    class="tab"
                    href="https://itzrymo.com/"
                    target="_blank"
                >
                    🛒 Redline Merch
                </a>

                <!-- Meet Information -->
                <a
                    class="tab"
                    href="#"
                    target="_blank"
                >
                    🏁 Redline Meet Information
                </a>

            </div>


            <!-- NEXT MEET COUNTDOWN -->
            <div class="timer-box">

                <div class="timer-title">
                    Next Redline Meet
                </div>

                <div id="countdown">
                    Loading...
                </div>

                <div class="meet-date">
                    Next Meet: September 10, 2026
                </div>

            </div>


            <div class="footer">
                © 2026 REDLINE • Tennessee
            </div>

        </div>

    </div>


    <script>

        /*
        ==========================================
        REDLINE MEET DATE
        ==========================================

        Change this date whenever you schedule
        a new meet.

        Format:
        YYYY-MM-DDTHH:MM:SS

        Example:
        September 26, 2026 at 7:00 PM
        ==========================================
        */

        const meetDate = new Date("2026-09-26T19:00:00").getTime();


        function updateCountdown() {

            const now = new Date().getTime();

            const difference = meetDate - now;


            if (difference <= 0) {

                document.getElementById("countdown").innerHTML =
                    "THE MEET IS HERE! 🏁";

                return;
            }


            const days = Math.floor(
                difference / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (difference % (1000 * 60 * 60 * 24))
                / (1000 * 60 * 60)
            );

            const minutes = Math.floor(
                (difference % (1000 * 60 * 60))
                / (1000 * 60)
            );

            const seconds = Math.floor(
                (difference % (1000 * 60))
                / 1000
            );


            document.getElementById("countdown").innerHTML =
                `${days}D : ${hours}H : ${minutes}M : ${seconds}S`;
        }


        updateCountdown();

        setInterval(updateCountdown, 1000);

    </script>

</body>
</html>
